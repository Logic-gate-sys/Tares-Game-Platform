syntax = "proto3";
package user.v1;

option go_package = "github.com/logic-gate-sys/wss_service/pkg/user/v1;userpb";

service UserService {
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse); 
}

message GetUserStatsRequest{
  int32 user_id=1;
}

message GetUserStatsResponse {
  string id =1;
  string name=2;
  string level=3;
  string rank=4;
  PlayerStats stats = 5;
}


message PlayerStats {
  int32 wins = 1;
  double accuracy=2;
}
