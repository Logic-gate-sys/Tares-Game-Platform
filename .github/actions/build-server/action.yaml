name: 'Build Go Server'
description: 'Installs dependencies and compiles the Go binary'


runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v5 # setup-go@v5 automatically handles dependency caching
      with:
        go-version: 1.26 
    - run: go mod download
      shell: bash
    - run: |
        mkdir -p bin
        go build -o bin/server ./server/main.go
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: bin
        path: bin/